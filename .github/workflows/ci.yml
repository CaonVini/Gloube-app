name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora
          POSTGRES_DB: aurora
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aurora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valores só de teste (efêmeros, banco descartável do runner). Nenhum segredo real entra aqui.
      DATABASE_URL: postgres://aurora:aurora@localhost:5432/aurora
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
