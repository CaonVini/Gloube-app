# Sobe tudo: Postgres + migrations + API.
#   docker compose up --build
# API em http://localhost:3333  (teste: curl localhost:3333/health)
#
# Configuração opcional em um arquivo .env ao lado deste (veja .env.example):
# JWT_ACCESS_SECRET, GOOGLE_CLIENT_IDS, FACEBOOK_APP_ID, FACEBOOK_APP_SECRET...

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-development}
  DATABASE_URL: postgres://${POSTGRES_USER:-aurora}:${POSTGRES_PASSWORD:-aurora}@postgres:5432/${POSTGRES_DB:-aurora}
  # Segredo SÓ para desenvolvimento local. Em produção (NODE_ENV=production) a API recusa iniciar com ele.
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-insecure-secret-change-me-0123456789}
  JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
  FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
  FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  # Fotos: por padrão usa o MinIO local deste compose (S3 compatível). Em produção aponte para o S3 real
  # (S3_ENDPOINT vazio, S3_FORCE_PATH_STYLE=false e IAM role/chaves).
  S3_BUCKET: ${S3_BUCKET:-aurora-avatars}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: ${S3_ENDPOINT-http://minio:9000}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-aurora-dev}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-aurora-dev-secret-change-me}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  AVATAR_URL_TTL_SECONDS: ${AVATAR_URL_TTL_SECONDS:-300}

services:
  postgres:
    image: postgres:16-alpine
    container_name: aurora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aurora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurora}
      POSTGRES_DB: ${POSTGRES_DB:-aurora}
    ports:
      # Exposto apenas em localhost (para usar psql/DBeaver); a API acessa pela rede interna
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 compatível SÓ para desenvolvimento local (bucket privado). Console em http://127.0.0.1:9001
  minio:
    image: minio/minio:latest
    container_name: aurora-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-aurora-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-aurora-dev-secret-change-me}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cria o bucket privado uma vez e termina
  minio-init:
    image: minio/mc:latest
    container_name: aurora-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing local/${S3_BUCKET:-aurora-avatars}"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-aurora-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-aurora-dev-secret-change-me}
    restart: "no"

  # Executa as migrations do Drizzle uma vez e termina
  migrate:
    build: .
    image: aurora-api
    container_name: aurora-migrate
    command: ["node", "dist/infra/database/migrate.js"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: aurora-api
    container_name: aurora-api
    restart: unless-stopped
    environment: *api-env
    ports:
      # 0.0.0.0 para o celular na mesma rede Wi-Fi acessar (http://IP-DO-PC:3333)
      - "3333:3333"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  miniodata:
